      <td align="center">
        <h1><font color="#c2185b" face="Georgia">see the world from my view</font></h1>
        <p>نحن نصنع السعادة ونقدمها بأسلوب عصري</p>
      </td>
    </tr>
  </table>

  <p align="center">
    <a href="index.html">تسجيل الدخول</a> |

  <table align="center" bgcolor="#ffffff" width="400" cellpadding="20" cellspacing="0">
    <tr>
      <td align="center">
        <h2><font color="#c2185b">تسجيل الدخول</font></h2>
        <!-- في مرحلة PHP سنغيّر action إلى login.php -->
        <form action="about.html" method="post">
          <p>
            <label for="email">البريد الإلكتروني</label><br>
            <input type="email" id="email" name="email" size="30" required>
          </p>
          <p>
            <label for="password">كلمة المرور</label><br>
            <input type="password" id="password" name="password" size="30" required>
          </p>
          <p><input type="submit" value="دخول"></p>
        </form>
        <p>ليس لديك حساب؟ <a href="#register">أنشئي حساباً جديداً</a></p>
      </td>
    </tr>
  </table>
  <br>
  <table align="center" bgcolor="#ffffff" width="400" cellpadding="20" cellspacing="0" id="register">
    <tr>
      <td align="center">
        <h2><font color="#c2185b">إنشاء حساب جديد</font></h2>
        <!-- في مرحلة PHP سنغيّر action إلى register.php -->
        <form action="about.html" method="post">
          <fieldset>
            <legend>بيانات الحساب</legend>
            <p>
              <label for="rname">الاسم الكامل</label><br>
              <input type="text" id="rname" name="name" size="30" required>
            </p>
            <p>
              <label for="remail">البريد الإلكتروني</label><br>
              <input type="email" id="remail" name="email" size="30" required>
            </p>
            <p>
              <label for="rphone">رقم الهاتف</label><br>
              <input type="tel" id="rphone" name="phone" size="30">
            </p>
            <p>
              <label for="rcity">المدينة</label><br>
              <select id="rcity" name="city">
                <option value="">اختاري المدينة</option>
                <option>ود مدني</option>
                <option>الخرطوم</option>
                <option>أم درمان</option>
                <option>بورتسودان</option>
                <option>أخرى</option>
              </select>
            </p>
            <p>
              <label for="rpass">كلمة المرور</label><br>
              <input type="password" id="rpass" name="password" size="30" required>
            </p>
            <p>
              <label for="rpass2">تأكيد كلمة المرور</label><br>
              <input type="password" id="rpass2" name="password2" size="30" required>
            </p>
            <p>
              <input type="checkbox" id="terms" name="terms" required>
              <label for="terms">أوافق على شروط المتجر</label>
            </p>
          </fieldset>
          <p><input type="submit" value="إنشاء الحساب"> <input type="reset" value="مسح"></p>
        </form>
        <p><a href="#top">لديك حساب؟ سجّلي الدخول</a></p>
      </td>
    </tr>
  </table>
  <br>

  <p align="center"><a href="#top">&#8593; العودة للأعلى</a></p>
  <p align="center"><font color="#ffffff">&copy; see the world from my view</font></p>

</body>
</html>
